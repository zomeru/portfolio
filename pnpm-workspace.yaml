  - '@sanity/diff@6.10.0'
  - '@sanity/mutator@6.10.0'
  - '@sanity/schema@6.10.0'
  - '@sanity/types@6.10.0'
  - '@sanity/util@6.10.0'
  - '@sanity/vision@6.10.0'
  - '@sanity/workbench-cli@2.0.2'
  - '@sanity/workbench@0.1.0-alpha.42'
  - get-it@9.5.0
  - sanity@6.10.0
