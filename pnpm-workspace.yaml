packages:
  - "apps/*"
  - "packages/*"

# Versions shared by more than one workspace manifest. Single-use dependencies stay in their
# owning package.json. Reference these with "catalog:".
catalog:
  "@types/node": ^26.6.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  # @opentelemetry/sdk-trace-base 2.x declares a peer range of <1.10.0.
  "@opentelemetry/api": ~1.9.1
  ai: ^7.0.172
  hono: ^4.13.18
  react: 19.3.1
  react-dom: 19.3.1
  tsx: ^4.23.15
  typescript: 7.1.0-beta
  zod: ^4.6.7

# Security floors for transitive dependencies whose parents have not shipped patched ranges yet.
# Remove an entry once `pnpm audit` stays clean without it.
overrides:
  "js-yaml@>=3 <3.15.2": "3.15.2"
  "@oclif/core>minimatch@>=7 <11.0.1": "11.0.8"
  "smol-toml@<1.9.0": "1.9.1"

allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  esbuild: true
  protobufjs: false
  unrs-resolver: true
  workerd: true
