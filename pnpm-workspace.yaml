packages:
  - "apps/*"
  - "packages/*"

overrides:
  "js-yaml@<3.15.1": "3.15.1"
  "smol-toml@<1.6.1": "1.6.1"
  "uuid@<11.1.1": "11.1.1"

allowBuilds:
  esbuild: true
  protobufjs: false
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - get-it@9.5.0
  - '@ai-sdk/gateway@4.0.60 || 4.0.62'
  - ai@7.0.74 || 7.0.77
  - '@ai-sdk/google@4.0.50'
  - '@ai-sdk/provider-utils@5.0.29'
  - '@ai-sdk/mcp@2.0.36'
  - '@ai-sdk/react@4.0.80'
