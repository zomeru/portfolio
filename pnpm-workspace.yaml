packages:
  - "apps/*"
  - "packages/*"

# Versions shared by more than one workspace manifest. Single-use dependencies stay in their
# owning package.json. Reference these with "catalog:".
catalog:
  "@types/node": ^26.6.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  # @opentelemetry/sdk-trace-base 2.x declares a peer range of <1.10.0.
  "@opentelemetry/api": ~1.9.1
  ai: ^7.0.181
  hono: ^4.13.21
  react: 19.3.1
  react-dom: 19.3.1
  tsx: ^4.23.15
  typescript: 7.1.0-beta
  zod: ^4.6.7

# Security floors for transitive dependencies whose parents have not shipped patched ranges yet.
# Remove an entry once `pnpm audit` stays clean without it.
overrides:
  "js-yaml@>=3 <3.15.2": "3.15.2"
  "@oclif/core>minimatch@>=7 <11.0.1": "11.0.8"
  "smol-toml@<1.9.0": "1.9.1"

allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  esbuild: true
  protobufjs: false
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - "@ai-sdk/gateway@4.0.154"
  - "@ai-sdk/google@4.0.125"
  - "@ai-sdk/mcp@2.0.104"
  - "@ai-sdk/react@4.0.186"
  - "@cloudflare/workers-utils@0.57.0"
  - "@oxfmt/binding-android-arm-eabi@0.80.0"
  - "@oxfmt/binding-android-arm64@0.80.0"
  - "@oxfmt/binding-darwin-arm64@0.80.0"
  - "@oxfmt/binding-darwin-x64@0.80.0"
  - "@oxfmt/binding-freebsd-x64@0.80.0"
  - "@oxfmt/binding-linux-arm-gnueabihf@0.80.0"
  - "@oxfmt/binding-linux-arm-musleabihf@0.80.0"
  - "@oxfmt/binding-linux-arm64-gnu@0.80.0"
  - "@oxfmt/binding-linux-arm64-musl@0.80.0"
  - "@oxfmt/binding-linux-ppc64-gnu@0.80.0"
  - "@oxfmt/binding-linux-riscv64-gnu@0.80.0"
  - "@oxfmt/binding-linux-riscv64-musl@0.80.0"
  - "@oxfmt/binding-linux-s390x-gnu@0.80.0"
