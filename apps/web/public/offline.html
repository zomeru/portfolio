<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" />
    <title>Offline — Zomer Gregorio</title>
    <style>
      :root { color-scheme: light dark; font-family: Arial, Helvetica, sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #fafafa; color: #0a0a0a; }
      main { width: min(34rem, calc(100% - 2.5rem)); }
      p { color: #52525b; line-height: 1.7; }
      a { color: inherit; text-underline-offset: 4px; }
      @media (prefers-color-scheme: dark) { body { background: #0a0a0a; color: #fafafa; } p { color: #a1a1aa; } }
    </style>
  </head>
  <body>
    <main>
      <p style="font-family: monospace; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase;">Offline</p>
      <h1>There is no connection right now.</h1>
      <p>Reconnect to load the latest portfolio and blog content. Dynamic posts are kept network-first so you do not see an outdated article.</p>
      <p><a href="/" id="retry-link">Reload page</a></p>
    </main>
    <script>
      document.getElementById('retry-link').addEventListener('click', function (e) {
        e.preventDefault();
        location.reload();
      });
    </script>
  </body>
</html>
