name: CI
permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            relevant:
              - '!**.md'
              - '!.agents/**'
              - '!.changeset/**'
              - '!.claude/**'
              - '!.github/workflows/deploy-studio.yml'
              - '!.vscode/**'
              - '!.graphifyignore'
              - '!renovate.json'
              - '!skills-lock.json'

  check-and-build:
    name: Format, Lint, and Build
    needs: changes
    if: needs.changes.outputs.should_run == 'true'

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm (includes Node.js + cache)
        uses: pnpm/setup@v3.1.2
        with:
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Cache Turbo
        uses: actions/cache@v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify and build all workspaces
        run: pnpm run check:all:build

      - name: Check Cloudflare Worker bundles
        run: |
          pnpm run deploy:staging --dry-run
          pnpm run deploy:production --dry-run

      - name: Audit dependencies
        run: pnpm run security:check

      - name: Audit production dependencies
        run: pnpm run security:audit
