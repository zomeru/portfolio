name: CI
permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            relevant:
              - '!**.md'
              - '!.agents/**'
              - '!.changeset/**'
              - '!.claude/**'
              - '!.github/workflows/deploy-studio.yml'
              - '!.vscode/**'
              - '!.graphifyignore'
              - '!renovate.json'
              - '!skills-lock.json'

  check-and-build:
    name: Format, Lint, and Build
    needs: changes
    if: needs.changes.outputs.should_run == 'true'

    runs-on: ubuntu-latest
    environment:
      name: Preview
      deployment: false

    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pnpm (includes Node.js + cache)
        uses: pnpm/setup@v1
        with:
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Cache pnpm store and Next.js build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.pnpm-store
            ${{ github.workspace }}/apps/*/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and linting with Oxc
        run: pnpm run lint

      - name: Check workspace boundaries
        run: pnpm run boundaries

      - name: Check dependency consistency
        run: pnpm run deps:check

      - name: Check unused files
        run: pnpm run deps:unused

      - name: Type check
        run: pnpm run check-types

      - name: Test public contracts
        run: pnpm run test

      - name: Build all apps
        run: pnpm run build:all

      - name: Audit dependencies
        run: pnpm run security:check

      - name: Audit production dependencies
        run: pnpm run security:audit
