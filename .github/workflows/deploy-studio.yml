name: Deploy Sanity Studio

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/studio/**"
      - "packages/content/**"
      - "packages/env/**"
      - "packages/typescript-config/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-studio.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'Production' || 'Preview' }}
    env:
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      SANITY_APP_ID: ${{ vars.SANITY_APP_ID }}
      SANITY_DATASET: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm (includes Node.js + cache)
        uses: pnpm/setup@v3.1.2
        with:
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm --filter @portfolio/studio check-types

      - name: Build
        run: pnpm --filter @portfolio/studio build

      - name: Deploy
        run: pnpm --filter @portfolio/studio run deploy
